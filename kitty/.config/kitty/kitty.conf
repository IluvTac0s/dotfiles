
term xterm-kitty

shell_integration enabled
allow_hyperlinks yes
detect_urls yes
url_style curly
confirm_os_window_close 0

# Kitty automatically reloads this file when it changes.
auto_reload_config 0.1

# ─────────────────────────────────────────────────────────────
# Font
# ─────────────────────────────────────────────────────────────

font_family DepartureMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

font_size 13.0
disable_ligatures never

# ─────────────────────────────────────────────────────────────
# Window appearance
# ─────────────────────────────────────────────────────────────

background_opacity 0.96
background_blur 0

window_padding_width 8
window_margin_width 0

hide_window_decorations yes
inactive_text_alpha 0.85

cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0

enable_audio_bell no
visual_bell_duration 0

# ─────────────────────────────────────────────────────────────
# Tabs
# ─────────────────────────────────────────────────────────────

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_foreground #e6defa
active_tab_background #854efc
inactive_tab_foreground #a99abb
inactive_tab_background #33205e
tab_bar_background #211b2d

# ─────────────────────────────────────────────────────────────
# Colors
# ─────────────────────────────────────────────────────────────

background #211b2d
foreground #e6defa

selection_background #854efc
selection_foreground #e6defa

cursor #a875ff
cursor_text_color #211b2d

url_color #a875ff

# Black
color0  #211b2d
color8  #6f6380

# Red
color1  #f26d85
color9  #ff8197

# Green
color2  #a6d189
color10 #b8e39b

# Yellow
color3  #f0b35b
color11 #ffcb78

# Blue
color4  #8f9fff
color12 #a8b4ff

# Magenta
color5  #a875ff
color13 #bd91ff

# Cyan
color6  #80d4d4
color14 #9be8e8

# White
color7  #e6defa
color15 #ffffff

# ─────────────────────────────────────────────────────────────
# Keybindings
# ─────────────────────────────────────────────────────────────

# Font size
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+kp_subtract change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Window management
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# Tabs
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Layouts
map ctrl+shift+l next_layout

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Open URLs detected in terminal output
map ctrl+shift+e open_url_with_hints

# Reload kitty.conf manually
map ctrl+shift+f5 load_config_file
